# OpenMontage - Global Configuration

llm:
  provider: gemini               # gemini | ollama; provider switches are always explicit
  model: gemini-3.5-flash-lite
  temperature: 0.7
  max_tokens: 4096
  ollama_base_url: http://localhost:11434
  request_timeout_seconds: 120

tts:
  provider: elevenlabs          # Routes to the registered elevenlabs_tts tool; no automatic fallback
  elevenlabs:
    model_id: eleven_multilingual_v2
    voice_name: Brian
    voice_id: nPczCjzI2devNBz1zQrb
    language: en
    output_format: wav_44100     # WAV PCM, 44.1 kHz; locally converted from MP3 44.1 kHz
  voicestudio:
    base_url: http://localhost:3900
    model: kittentts
    voice: expr-voice-2-m         # Jasper in KittenTTS 0.8
    speed: 1.0
    timeout: 900

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
